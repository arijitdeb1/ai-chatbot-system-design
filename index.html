 sse:{t:"Streaming: SSE vs WebSocket",d:"Send tokens as they're generated, over one of two live connections.",how:["HTTPS + SSE: one-way stream over normal HTTPS. Works with CDNs, WAFs, gateways and load balancers; each message has its own auth and rate limit","WebSocket: one long-lived, two-way connection for voice, interrupts and live [[handoff|human handoff]]","WebSocket costs: sticky load balancing, draining on deploy, your own re-auth and per-message rate limits; some corporate proxies block it","Either way, raise idle timeouts and turn off proxy buffering on the streaming route"],tr:"Start with HTTPS + SSE. Add WebSocket later for voice or live handoff."},
 ttft:{t:"Time to first token (TTFT)",d:"Time from sending a prompt to seeing the first word.",how:["Main measure of how fast the bot feels","Driven by queueing, prompt size and model","Target under about 1.5 s at p95"],tr:"Low TTFT with slow tokens/sec still feels sluggish."},
 moderation:{t:"Moderation",d:"Classifying text for harmful or disallowed content.",how:["Run on input and output","Check streamed chunks as they arrive","Block, rewrite or flag based on category","Managed: AWS Bedrock Guardrails content filters, Azure AI Content Safety, OpenAI Moderation API (free), Google Model Armor","Open models you host: Llama Guard, ShieldGemma; wire them in with NVIDIA NeMo Guardrails or Guardrails AI","Custom business rules: a decision model such as Jev (TypeSafe) returns a typed yes/no or category for your own policy, e.g. \"does this answer give medical or financial advice?\""],tr:"Adds a little latency and some false positives."},
 grounding:{t:"Grounding check",d:"Verifying that the answer is supported by the retrieved sources.",how:["Compare claims in the answer with source passages","Flag or drop unsupported claims","Show citations to the user","Built in: AWS Bedrock Guardrails contextual grounding check (scores grounding and relevance, blocks below a threshold), Azure AI Content Safety groundedness detection"],tr:"Extra model call; only applies when sources exist."},
 schema:{t:"Schema validation",d:"Checking structured output (like JSON) matches the expected shape.",how:["Validate against a JSON schema","Retry once with the error message","Fall back to plain text if still invalid"],tr:"Retries add latency on failures."},
 liveevals:{t:"Real-time evaluations",d:"Scoring live answers in production, so quality drops show up in minutes.",how:["Inline: add a contextual grounding filter (grounding and relevance thresholds) to a Bedrock guardrail, then call ApplyGuardrail with source OUTPUT: passages tagged grounding_source, question tagged query, answer tagged guard_content","Action GUARDRAIL_INTERVENED means the answer isn't backed by the passages: block it or fall back","Sampled: an LLM judge scores about 5% of traffic, plus thumbs up/down","Tools: Langfuse, LangSmith, Arize Phoenix, Datadog LLM Observability"],tr:"Inline checks add latency to every reply; sampling is cheaper but catches problems later."},
 driftdetect:{t:"Drift detection",d:"Spotting answers that slowly get worse after a model, prompt or data change, before users complain.",how:["Track quality scores, refusal rate, answer length and thumbs-down by model and prompt version","Watch for new question topics the knowledge base doesn't cover (embedding drift, rising 'no passage found')","Tools: Arize Phoenix, Evidently AI, Fiddler AI, Langfuse, Datadog LLM Observability; on AWS, Amazon CloudWatch anomaly detection and Amazon SageMaker Model Monitor for self-hosted models","Prevention sits in the LLM gateway chip on prompt and model changes"],tr:"Small drops hide in noise; compare against a fixed baseline, not just last week."},
 hitl:{t:"Human approval (human-in-the-loop)",d:"The agent pauses before a risky action, shows exactly what it will do, and continues only after a person approves. Unlike a [[handoff|human handoff]], the bot keeps the conversation.",how:["Decide by risk: reads run freely; writes, payments and messages need approval; set thresholds such as refunds over $100","Inline: show an action card in the chat (\"Refund $240 to card ending 4421?\") with Approve / Cancel","Async: for a manager or second person, pause and send the request to Slack, email or a ticket, then resume when they answer","Built in: LangGraph interrupt with a checkpointer, AWS Bedrock Agents user confirmation and return of control, OpenAI Agents SDK tool approvals, AWS Step Functions wait for task token for long approvals","Approve the exact action and arguments, expire stale approvals, and log who approved"],tr:"Every approval adds friction; ask only where a mistake is costly or can't be undone."},

const TA={"MCP":"Model Context Protocol","Azure Entra ID":"Entra ID","Entra External ID":"Entra ID","Microsoft Entra":"Entra ID","Front Door":"Azure Front Door","Prolexic":"Akamai","App & API Protector":"Akamai","Azure APIM":"Azure API Management","Google Apigee":"Apigee","Application Load Balancer":"Elastic Load Balancing","Network Load Balancer":"Elastic Load Balancing","ALB":"Elastic Load Balancing","NLB":"Elastic Load Balancing","Rego":"OPA","Prompt Shields":"Azure AI Content Safety","TypeSafe":"Jev","Aurelio AI":"Semantic Router","Postgres":"PostgreSQL","AWS Bedrock AgentCore Memory":"AgentCore","Azure AI Foundry Agent Service":"Azure AI Foundry"};
const tinfo=n=>TI[n]||TI[TA[n]];
const unesc=t=>t.replace(/&amp;/g,"&");
const hl=t=>esc(t).replace(TRX,(m,n)=>tinfo(unesc(n))?`<mark class="tool tl" tabindex="0" data-tool="${n}">${n}</mark>`:`<mark class="tool">${n}</mark>`);
const link=s=>String(s??"").split(/(\[\[[^\]]+\]\])/).map(part=>{const m=part.match(/^\[\[([^\]|]+)(?:\|([^\]]+))?\]\]$/);return m?`<button type="button" class="cl" data-con="${m[1]}">${esc(m[2]||C[m[1]].t)}</button>`:hl(part)}).join("");
const chip=id=>`<button class="chip ${P[id].c}" type="button" data-p="${id}"><i></i><span>${esc(P[id].t)}</span></button>`;

const NFR=["latency","scalable","available","secure","cost","blind"];
document.getElementById("nfr").innerHTML=NFR.map(id=>chip(id).replace("</button>",`<em class="cid">${P[id].id}</em></button>`)).join("");
function nodeHtml(id){const n=NODES[id];return `<div class="node ${id}" role="button" tabindex="0" data-node="${id}"><div class="t">${n.t}</div>${n.tiers?`<div class="tiers">${n.tiers.map(([a,b])=>`<div class="tier"><span>${a}</span>${b}</div>`).join("")}</div>`:""}${n.inner?`<div class="inner">${n.inner.map(x=>typeof x==="string"?chip(x):`<div class="ig">${x.g}</div>${x.note?`<a class="actnote" href="#lanes"><span>${x.note}</span><b>↓</b></a>`:x.cps.map(chip).join("")}`).join("")}</div>`:""}</div>`}
const grpHtml=(x,cls="")=>`<div class="grp${cls}"><div class="gl${x.con?" glk":""}"${x.con?` data-con="${x.con}" role="button" tabindex="0"`:""}><span>${x.con?`<b class="gcl">${x.g}</b> <i class="ghint">ⓘ</i>`:x.g}</span><small>${x.d}</small></div><div class="gc">${x.cps.map(chip).join("")}</div></div>`;
const hlHtml=([f,bk])=>`<div class="hl" aria-hidden="true">${f?`<i class="ah r"></i><span class="f">${f}</span>`:""}${bk?`<i class="ah l"></i><span class="b">${bk}</span>`:""}</div>`;
let pre=true;
document.getElementById("flow").innerHTML=LAYOUT.map(s=>{
 const cls=pre?" pre":"";if(s.node==="orch")pre=false;
 if(s.node)return nodeHtml(s.node).replace('class="node ',`class="node${cls} `);
 return `<div class="gate${cls}"><div class="arrow"></div>${s.gate.map(x=>typeof x==="string"?chip(x):grpHtml(x)).join("")}</div>`;
}).join("")+`<div class="drop" aria-hidden="true"><div class="vlink"><i class="ah up"></i><i class="ah dn"></i><span>fetch context ↓<br>context ↑</span></div></div>
<section class="lanes" id="lanes"><div class="grp lanehd"><div class="gl glk" data-con="context" role="button" tabindex="0"><span><b class="gcl">Context the orchestrator fetches</b> <i class="ghint">ⓘ</i></span><small>Live data and documents the LLM can't see on its own</small></div></div>${LANES.map(l=>`<div class="lanewrap"><div class="lt">${l.t}</div><div class="lane">${l.items.map(x=>x.hl?hlHtml(x.hl):x.node?nodeHtml(x.node):grpHtml(x,x.w?" branch w2":" branch")).join("")}</div></div>`).join("")}</section>`;

/* popup stack */
const host=document.getElementById("pops");
let stack=[]; // {el, src, key}
function body(kind,key){
 const close=`<button class="close" type="button" data-close>✕ Close</button>`;
 if(kind==="p"){const p=P[key];
  const scope=p.scope?`<div class="blk scope"><div class="label">${p.id||""} scope</div><div class="sc in"><b>Covers</b><span>${p.scope.in.map(link).join(" · ")}</span></div><div class="sc out"><b>Not covered</b><ul>${p.scope.out.map(x=>`<li>${link(x)}</li>`).join("")}</ul></div></div>`:"";
  return {cls:p.c,html:`<div class="top"><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag">${CATS[p.c]}</span>${p.id&&p.id!==CATS[p.c]?`<span class="tag idt">${p.id}</span>`:""}</span>${close}</div>
  <h3>${esc(p.t)}</h3><p class="scn">${link(p.scn)}</p>${scope}
  ${p.target?`<div class="blk"><div class="label">Target</div><p class="tgt">${link(p.target)}</p></div>`:""}<div class="blk brk"><div class="label">What goes wrong</div><ul>${p.brk.map(x=>`<li>${link(x)}</li>`).join("")}</ul></div>
  <div class="blk"><div class="label">How to solve it</div><ul>${p.how.map(x=>`<li>${link(x)}</li>`).join("")}</ul></div>
  <div class="blk"><div class="label">Concepts to dig into</div><div class="cls">${p.con.map(k=>`<button type="button" class="cl" data-con="${k}">${esc(C[k].t)}</button>`).join("")}</div><div class="hint">Hover a concept for the deep dive</div></div>`}}
 if(kind==="t"){const [line,url]=tinfo(key);
  return {cls:"tool",html:`<div class="top"><span class="tag">Tool</span>${close}</div><h3>${esc(key)}</h3><p>${esc(line)}</p>${url?`<a class="tlink" href="${url}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))} ↗</a>`:""}`}}
 if(kind==="n"){const n=NODES[key].pop;
  return {cls:"concept",html:`<div class="top"><span class="tag">Component</span>${close}</div><h3>${esc(n.t)}</h3><p>${link(n.d)}</p>
  <div class="blk"><div class="label">Key points</div><ul>${n.how.map(x=>`<li>${link(x)}</li>`).join("")}</ul></div>`}}
 const c=C[key];
 return {cls:"concept",html:`<div class="top"><span class="tag">Concept</span>${close}</div><h3>${esc(c.t)}</h3>${c.an?`<p class="scn">${link(c.an)}</p>`:""}<p>${link(c.d)}</p>
  <div class="blk"><div class="label">How it works</div><ul>${c.how.map(x=>`<li>${link(x)}</li>`).join("")}</ul></div>
  <div class="blk"><div class="label">Trade-off</div><p>${link(c.tr)}</p></div>`};
}
function place(pop,src,depth){
 if(innerWidth<=640)return;
 const r=(depth>0?src.closest(".pop"):src).getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight,vw=innerWidth,vh=innerHeight;
 let x=r.right+12;if(x+w>vw-16)x=r.left-w-12;
 let y=depth>0?src.getBoundingClientRect().top-20:r.top-8;
 if(x<16){x=Math.max(16,Math.min(vw-w-16,r.left+(depth>0?28:0)));y=depth>0?r.top+40:r.bottom+10;if(y+h>vh-16)y=Math.max(16,(depth>0?r.top+40:r.top-h-10))}
 y=Math.min(Math.max(16,y),vh-h-16);
 pop.style.left=x+"px";pop.style.top=Math.max(16,y)+"px";
}
function open(kind,key,src,depth){
 if(stack[depth]&&stack[depth].kind===kind&&stack[depth].key===key&&stack.length===depth+1)return;
 closeFrom(depth);
 const {cls,html}=body(kind,key);
 const pop=document.createElement("div");
 pop.className="pop "+cls;pop.setAttribute("role","dialog");pop.setAttribute("aria-label",kind==="p"?P[key].t:kind==="n"?NODES[key].pop.t:kind==="t"?key:C[key].t);
 pop.style.zIndex=20+depth;pop.dataset.depth=depth;pop.innerHTML=html;host.appendChild(pop);
 place(pop,src,depth);src.classList.add("open");
 stack[depth]={kind,key,el:pop,src};
 requestAnimationFrame(()=>pop.classList.add("show"));
}
function closeFrom(d){while(stack.length>d){const s=stack.pop();s.el.remove();s.src.classList.remove("open")}}

/* hover with a short delay, so moving the pointer across chips toward a popup doesn't swap it */
let tmr=null;
const trig=e=>e.target.closest&&e.target.closest("[data-p],[data-node],[data-con],[data-tool]");
function req(el){
 if(el.dataset.tool){const pp=el.closest(".pop");open("t",el.dataset.tool.replace(/&amp;/g,"&"),el,pp?+pp.dataset.depth+1:0);return}
 if(el.dataset.con){const pp=el.closest(".pop");const d=pp?+pp.dataset.depth+1:0;open("c",el.dataset.con,el,d)}
 else open(el.dataset.p?"p":"n",el.dataset.p||el.dataset.node,el,0);
}
const hoverable=matchMedia("(hover:hover)").matches;
document.addEventListener("pointerover",e=>{if(!hoverable)return;const el=trig(e);if(!el)return;if(el.dataset.node&&e.target.closest("[data-p],.actnote"))return;clearTimeout(tmr);tmr=setTimeout(()=>req(el),(el.dataset.con||el.dataset.tool)?220:320)});
document.addEventListener("pointerout",e=>{const el=trig(e);if(el&&!el.contains(e.relatedTarget))clearTimeout(tmr)});
document.addEventListener("click",e=>{
 const an=e.target.closest&&e.target.closest(".actnote");if(an){e.preventDefault();closeFrom(0);document.getElementById("lanes").scrollIntoView({behavior:"smooth",block:"start"});return}
 const c=e.target.closest("[data-close]");
 if(c){closeFrom(+c.closest(".pop").dataset.depth);return}
 const el=trig(e);
 if(!el){const inPop=e.target.closest(".pop");closeFrom(inPop?+inPop.dataset.depth+1:0);return}
 if(el.dataset.node&&e.target.closest("[data-p]"))return;
 clearTimeout(tmr);req(el);
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&stack.length){closeFrom(stack.length-1);return}
 const el=e.target.closest&&e.target.closest("[data-node],.glk,[data-tool]");
 if(el&&e.target===el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();req(el)}
});
addEventListener("resize",()=>closeFrom(0));
</script>

</body>
